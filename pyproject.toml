[project]
name = "2026sanbo"
version = "0.1"
description = "Export-control retrieval evaluation: BM25 / dense / hybrid on Wassenaar, SCOMET, and US CCL control lists"
readme = "README.md"
license = { file = "LICENSE" }
# 검증 환경은 CPython 3.10.5. 3.10 미만은 `X | None` 타입 표기와
# `from __future__ import annotations` 조합에서 동작이 갈리므로 하한을 3.10으로 둔다.
# 상한은 torch 2.6.0 cpu 휠이 제공되는 범위를 넘지 않도록 3.13 미만으로 둔다.
requires-python = ">=3.10,<3.13"

# 정확 버전 고정 이유는 requirements.txt 머리말 참조.
# (열린 범위는 동점 정렬·부동소수 세부가 환경마다 달라져 감사 가능성을 해친다.)
dependencies = [
  "numpy==2.2.6",
  "scipy==1.15.3",
  "matplotlib==3.10.9",
  "pdfplumber==0.11.10",
  "pdfminer.six==20260107",
  "pypdfium2==5.12.1",
  "pillow==12.3.0",
]

[project.optional-dependencies]
# dense / hybrid 검색 실험 (TASK E, H). torch CPU 휠은 별도 인덱스가 필요하다:
#   python -m pip install torch==2.6.0+cpu --index-url https://download.pytorch.org/whl/cpu
dense = [
  "torch==2.6.0+cpu",
  "sentence-transformers==3.4.1",
  "transformers==4.57.6",
  "tokenizers==0.22.2",
  "huggingface-hub==0.36.2",
  "safetensors==0.8.0",
  "scikit-learn==1.7.2",
  "tqdm==4.67.3",
]
test = [
  "pytest==9.1.1",
]

[tool.uv.sources]
# torch CPU 휠 인덱스. uv 사용 시 아래 인덱스를 함께 등록해야 `+cpu` 로컬 버전이 풀린다.
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.sanbo.reproducibility]
# 재현 환경 스냅샷 (2026-07-30 실측). docs/reproducibility.md 와 같은 값이어야 한다.
verified_python = "3.10.5"
verified_platform = "Windows-10-10.0.26200-SP0"
# 임베딩 모델은 저장소에 포함하지 않고 실행 시 내려받는다.
# revision을 고정하지 않으면 Hugging Face 상류 갱신으로 수치가 바뀔 수 있다 -> 확인 필요.
embedding_models = [
  "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2",
  "intfloat/multilingual-e5-base",
  "BAAI/bge-m3",
  "sentence-transformers/LaBSE",
  "sentence-transformers/distiluse-base-multilingual-cased-v2",
]
